apiVersion: v1
kind: Service
metadata:
  name: inventario-app-bluegreen-service
  labels:
    app: inventario-app
spec:
  type: NodePort
  selector:
    app: inventario-app
    environment: blue  # Cambiar a 'green' para conmutar el trafico instantaneamente
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000
