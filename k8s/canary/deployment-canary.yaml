apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventario-app-v2
  labels:
    app: inventario-app
    release: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventario-app
      release: canary
  template:
    metadata:
      labels:
        app: inventario-app
        release: canary
    spec:
      containers:
        - name: inventario-app
          image: ghcr.io/kennypallchizaca-coder/inventario-app:23462bfbdb23c22b3d028f6e8edab0831165fc05
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: APP_VERSION
              value: "v2.0.0-canary"
            - name: APP_COLOR
              value: "green"
            - name: STARTUP_DELAY_SECONDS
              value: "10"
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: inventario-app-secret
                  key: API_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 10
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
