apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventario-app-v1
  labels:
    app: inventario-app
    version: v1
spec:
  replicas: 4
  selector:
    matchLabels:
      app: inventario-app
      version: v1
  template:
    metadata:
      labels:
        app: inventario-app
        version: v1
    spec:
      containers:
        - name: inventario-app
          image: ghcr.io/kennypallchizaca-coder/inventario-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: APP_VERSION
              value: "v1.0.0"
            - name: APP_COLOR
              value: "blue"
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: inventario-secret
                  key: API_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
